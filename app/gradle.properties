android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Tight heap + no daemon: the in-container compile runs under the per-stack 3g
# cap (ADR-0027); a resident Gradle/Kotlin daemon is the OOM class ADR-0013/0015
# fought, so we trade cold-compile speed for memory safety.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m
org.gradle.daemon=false
org.gradle.caching=true

# APPBUILDER: gradle configuration-cache
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
